services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  pubsub-delay:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: pubsub-delay-test
      INGEST_TOPIC: delay-ingest
      TIMEOUT_POOL_SIZE: "50"
      BUCKET_IDLE_TIMEOUT_MS: "30000"
      CLEANUP_INTERVAL_MS: "5000"
      ADVISORY_SYNC_INTERVAL_MS: "5000"
      PRECREATE_BUCKETS: "PT1S,PT2S,PT3S,PT4S,PT5S,PT6S,PT7S"
    depends_on:
      kafka:
        condition: service_healthy

  pubsub-delay-xform:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: pubsub-delay-xform
      INGEST_TOPIC: xform-ingest
      CONSUMER_GROUP_PREFIX: pubsub-delay-xform
      PRECREATE_BUCKETS: "PT2S"
      TRANSFORM_PLUGIN: http
      TRANSFORM_PRE_URL: http://integration-test:18081/pre
      TRANSFORM_POST_URL: http://integration-test:18081/post
      TRANSFORM_RETRY_BACKOFF_MS: "200"
    depends_on:
      kafka:
        condition: service_healthy

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      KAFKA_BROKERS: kafka:9092
      INGEST_TOPIC: delay-ingest
      DESTINATION_TOPIC: delay-output
      XFORM_INGEST_TOPIC: xform-ingest
      XFORM_DESTINATION_TOPIC: xform-output
      TRANSFORM_MOCK_PORT: "18081"
    depends_on:
      kafka:
        condition: service_healthy
      pubsub-delay:
        condition: service_healthy
      pubsub-delay-xform:
        condition: service_healthy
    volumes:
      - ./test-results:/app/test-results
