services:
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      # Increase for high throughput
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 1
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stress-test
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  bounded-pool:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: bounded-pool
      INGEST_TOPIC: bp-ingest
      CONSUMER_GROUP_PREFIX: bp-delay
      SCHEDULER_STRATEGY: bounded-pool
      TIMEOUT_POOL_SIZE: "1000"
      BUCKET_IDLE_TIMEOUT_MS: "300000"
      CLEANUP_INTERVAL_MS: "60000"
      ADVISORY_SYNC_INTERVAL_MS: "10000"
      PRECREATE_BUCKETS: "PT1S,PT2S,PT3S,PT4S,PT5S"
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      kafka:
        condition: service_healthy

  time-wheel:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      BROKER_TYPE: kafka
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: time-wheel
      INGEST_TOPIC: tw-ingest
      CONSUMER_GROUP_PREFIX: tw-delay
      SCHEDULER_STRATEGY: time-wheel
      WHEEL_RESOLUTION_MS: "50"
      WHEEL_SLOTS: "1200"
      BUCKET_IDLE_TIMEOUT_MS: "300000"
      CLEANUP_INTERVAL_MS: "60000"
      ADVISORY_SYNC_INTERVAL_MS: "10000"
      PRECREATE_BUCKETS: "PT1S,PT2S,PT3S,PT4S,PT5S"
      NODE_OPTIONS: "--max-old-space-size=384"
    depends_on:
      kafka:
        condition: service_healthy

  stress-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    entrypoint: ["node", "dist/test/stress/stress.test.js"]
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      KAFKA_BROKERS: kafka:9092
      BP_INGEST_TOPIC: bp-ingest
      BP_OUTPUT_TOPIC: bp-output
      TW_INGEST_TOPIC: tw-ingest
      TW_OUTPUT_TOPIC: tw-output
      # Stress test config - adjust as needed
      STRESS_DURATION_MINUTES: "60"
      MESSAGES_PER_SECOND: "100"
      REPORT_INTERVAL_SECONDS: "30"
    depends_on:
      kafka:
        condition: service_healthy
      bounded-pool:
        condition: service_healthy
      time-wheel:
        condition: service_healthy
